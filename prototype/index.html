<style>
  /* ============================================================
     DESIGN TOKENS
     ============================================================ */
  :root,
  [data-theme="dark"] {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface-elevated: #1a1a24;
    --border: #1c1c24;
    --border-light: #25252e;
    --text-primary: #f5f5f7;
    --text-secondary: #98989d;
    --text-tertiary: #636366;
    --accent: #007aff;
    --accent-soft: rgba(0,122,255,0.15);
    --success: #34c759;
    --warning: #ff9500;
    --danger: #ff3b30;
    --card-bg: #12121a;
    --card-border: #1c1c24;
    --card-ivory-bg: #1a1a24;
    --card-ivory-border: #25252e;
    --toggle-bg: #1c1c24;
    --toggle-on-bg: #007aff;
    --shadow: rgba(0,0,0,0.5);
    --overlay-bg: rgba(10,10,15,0.8);
    --gradient-welcome: linear-gradient(135deg, #007aff, #5856d6);
    --gradient-notif: linear-gradient(135deg, #5ac8fa, #007aff);
    --gradient-mission: linear-gradient(135deg, rgba(0,122,255,0.1), rgba(88,86,214,0.06));
    --gradient-streak: linear-gradient(135deg, #ff9500, #ff6b00);
  }

  [data-theme="light"] {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --surface-elevated: #f0f0f5;
    --border: #d1d1d6;
    --border-light: #e5e5ea;
    --text-primary: #1d1d1f;
    --text-secondary: #6e6e73;
    --text-tertiary: #8e8e93;
    --accent: #007aff;
    --accent-soft: rgba(0,122,255,0.1);
    --success: #34c759;
    --warning: #ff9500;
    --danger: #ff3b30;
    --card-bg: #ffffff;
    --card-border: #d1d1d6;
    --card-ivory-bg: #f2f2f7;
    --card-ivory-border: #e5e5ea;
    --toggle-bg: #d1d1d6;
    --toggle-on-bg: #007aff;
    --shadow: rgba(0,0,0,0.08);
    --overlay-bg: rgba(255,255,255,0.85);
    --gradient-welcome: linear-gradient(135deg, #007aff, #5856d6);
    --gradient-notif: linear-gradient(135deg, #007aff, #5ac8fa);
    --gradient-mission: linear-gradient(135deg, rgba(0,122,255,0.06), rgba(88,86,214,0.04));
    --gradient-streak: linear-gradient(135deg, #ff9500, #ff6b00);
  }

  /* ============================================================
     RESET
     ============================================================ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    overflow: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.25s ease, color 0.25s ease;
  }
  #root { height: 100%; }
  .phone-frame {
    width: 100%;
    max-width: 390px;
    height: 100vh;
    max-height: 844px;
    margin: 0 auto;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 40px var(--shadow);
    transition: background 0.25s ease;
  }
  @media (min-width: 480px) {
    body { display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px 0; }
    .phone-frame { border-radius: 40px; overflow: hidden; border: 1px solid var(--border); }
  }
  .screen { height: 100%; overflow-y: auto; padding: 20px 20px 110px; position: relative; background: var(--bg); scrollbar-width: none; }
  .screen::-webkit-scrollbar { display: none; }
  .status-bar { position: absolute; top: 0; left: 0; right: 0; padding: 12px 16px 8px; display: flex; justify-content: space-between; font-size: 12px; color: var(--text-tertiary); font-weight: 600; z-index: 10; }
  .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 20px 16px; display: flex; justify-content: space-around; border-top: 1px solid var(--border); background: var(--bg); }
  .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--text-tertiary); gap: 4px; cursor: pointer; padding: 6px 10px; border-radius: 8px; transition: all 0.2s; min-height: 44px; }
  .nav-item.active { color: var(--text-primary); }
  .nav-item:active { transform: scale(0.95); }
  .nav-icon { width: 24px; height: 24px; }

  /* Typography */
  h1 { font-size: 26px; font-weight: 700; line-height: 1.2; letter-spacing: -0.4px; }
  h2 { font-size: 20px; font-weight: 600; line-height: 1.35; letter-spacing: -0.2px; }
  h3 { font-size: 16px; font-weight: 600; line-height: 1.45; }
  p { font-size: 15px; line-height: 1.6; color: var(--text-secondary); }
  .label { font-size: 12px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.6px; }
  .small { font-size: 13px; color: var(--text-tertiary); line-height: 1.5; }
  .body-small { font-size: 14px; line-height: 1.6; color: var(--text-secondary); }
  .muted { color: var(--text-tertiary); }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 15px 22px; border-radius: 12px; font-size: 15px; font-weight: 600;
    border: none; cursor: pointer; transition: all 0.2s; width: 100%; min-height: 48px;
    -webkit-appearance: none; appearance: none;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: #0066d6; }
  .btn-primary:disabled { background: #3a6ea5; cursor: default; }
  .btn-secondary { background: var(--surface-elevated); color: var(--text-primary); border: 1px solid var(--border-light); }
  .btn-secondary:hover { background: var(--surface); }
  .btn-ghost { background: transparent; color: var(--accent); padding: 12px 16px; }
  .btn-ghost:hover { background: var(--accent-soft); }
  .btn-success { background: var(--success); color: white; }
  .btn-sm { padding: 10px 16px; font-size: 13px; border-radius: 10px; min-height: 40px; }

  /* Cards */
  .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 16px; }
  .card-ivory { background: var(--card-ivory-bg); border: 1px solid var(--card-ivory-border); border-radius: 14px; padding: 18px; }
  .chip { display: inline-block; padding: 5px 11px; border-radius: 10px; font-size: 12px; font-weight: 500; background: var(--surface-elevated); color: var(--text-secondary); }
  .chip-blue { background: var(--accent-soft); color: var(--accent); }

  /* Lesson card */
  .lesson-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px; margin-bottom: 14px; }
  .lesson-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .lesson-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .lesson-progress { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 16px; }
  .lesson-progress-bar { height: 100%; background: var(--accent); border-radius: 3px; width: 0%; transition: width 0.5s ease; }
  .completion-check { width: 56px; height: 56px; border-radius: 50%; background: var(--success); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
  @keyframes fadeIn { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
  @keyframes slideUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .fade-in { animation: fadeIn 0.4s ease; }
  .slide-up { animation: slideUp 0.5s ease; }

  /* Streak */
  .streak-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--gradient-streak); border-radius: 20px; color: white; font-weight: 700; font-size: 14px; }
  .streak-fire { font-size: 16px; }

  /* Notification */
  .notification-simulation {
    position: absolute; top: 60px; right: 10px; width: calc(100% - 32px); max-width: 85vw;
    background: var(--card-bg); border: 1px solid var(--border-light); border-radius: 14px; padding: 14px 16px;
    box-shadow: 0 12px 40px var(--shadow); z-index: 100; cursor: pointer;
    animation: slideInFromTop 0.4s ease;
    display: flex; align-items: center; gap: 12px;
  }
  @keyframes slideInFromTop { 0% { opacity: 0; transform: translateY(-20px); } 100% { opacity: 1; transform: translateY(0); } }
  .notification-icon { width: 40px; height: 40px; border-radius: 12px; background: var(--gradient-notif); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .notification-body { flex: 1; min-width: 0; }
  .notification-title { font-weight: 600; font-size: 14px; color: var(--text-primary); }
  .notification-text { font-size: 13px; color: var(--text-secondary); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .notification-time { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
  .notification-close { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; color: var(--text-tertiary); font-size: 18px; flex-shrink: 0; }

  /* Event log */
  .event-log {
    position: absolute; bottom: 80px; left: 16px; right: 16px; max-height: 200px;
    background: var(--overlay-bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px; overflow-y: auto; font-family: 'SF Mono', Menlo, monospace; font-size: 11px;
    z-index: 50; display: none; backdrop-filter: blur(10px);
  }
  .event-log.visible { display: block; }
  .event-entry { padding: 4px 0; border-bottom: 1px solid var(--border); color: var(--accent); }
  .event-entry .props { color: var(--text-tertiary); font-size: 10px; margin-top: 2px; }
  .event-entry .time { color: var(--text-tertiary); margin-right: 8px; }
  .toggle-events { position: absolute; top: 12px; right: 16px; z-index: 60; }

  /* Deep link animation */
  .deep-link-overlay {
    position: fixed; inset: 0; background: var(--bg); z-index: 200;
    display: flex; align-items: center; justify-content: center;
  }
  .deep-link-ring {
    width: 120px; height: 120px; border-radius: 50%;
    border: 3px solid var(--accent); animation: ringExpand 1s ease-out forwards;
  }
  @keyframes ringExpand { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }
  .deep-link-dot {
    width: 12px; height: 12px; border-radius: 50%; background: var(--accent);
    animation: dotAppear 0.3s ease 0.8s, dotPulse 1.5s ease 1.1s infinite;
  }
  @keyframes dotAppear { 0% { transform: scale(0); } 100% { transform: scale(1); } }
  @keyframes dotPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(0,122,255,0.5); } 50% { box-shadow: 0 0 0 16px rgba(0,122,255,0); } }

  /* Toggle switch */
  .toggle { position: relative; width: 48px; height: 28px; background: var(--toggle-bg); border-radius: 14px; cursor: pointer; transition: background 0.2s; flex-shrink: 0; }
  .toggle.on { background: var(--toggle-on-bg); }
  .toggle-knob { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: white; transition: transform 0.2s; }
  .toggle.on .toggle-knob { transform: translateX(20px); }

  /* Welcome screen */
  .welcome-logo { font-size: 48px; font-weight: 800; letter-spacing: -2px; background: var(--gradient-welcome); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 8px; }
  .welcome-subtitle { font-size: 14px; color: var(--text-tertiary); margin-top: 4px; }

  /* Divider */
  .divider { height: 1px; background: var(--border); margin: 16px 0; }

  /* Scrollbar for lesson content */
  .scroll-content { max-height: 60vh; overflow-y: auto; padding-right: 4px; }

  /* Tooltip style */
  .hint { font-size: 12px; color: var(--text-tertiary); font-style: italic; margin-top: 8px; }

  .tag {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 500;
    background: var(--surface-elevated); color: var(--text-tertiary);
  }

  /* Knowledge check */
  .kc-container {
    padding: 16px;
    background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px;
  }
  .kc-question {
    font-size: 15px; font-weight: 600; color: var(--text-primary); margin-bottom: 12px; line-height: 1.45;
  }
  .kc-options { display: flex; flex-direction: column; gap: 8px; }
  .kc-option {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 13px 14px; min-height: 44px;
    background: var(--surface-elevated); border: 1px solid var(--border-light);
    border-radius: 11px; cursor: pointer;
    font-size: 14px; color: var(--text-primary); text-align: left;
    transition: all 0.15s;
  }
  .kc-option:hover { background: var(--border); }
  .kc-option.selected { border-color: var(--accent); background: var(--accent-soft); }
  .kc-circle {
    width: 20px; height: 20px; flex-shrink: 0;
    border-radius: 50%; border: 2px solid var(--text-tertiary);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .kc-option.selected .kc-circle { border-color: var(--accent); background: var(--accent); color: white; }
  .kc-feedback {
    margin-top: 12px; padding: 11px 13px;
    border-radius: 10px; font-size: 13px;
  }
  .kc-feedback.correct {
    background: rgba(52,199,89,0.12); color: var(--success);
    border: 1px solid rgba(52,199,89,0.2);
  }
  .kc-feedback.incorrect {
    background: rgba(255,59,48,0.1); color: var(--warning);
    border: 1px solid rgba(255,149,0,0.2);
  }
  .kc-option:disabled { cursor: default; opacity: 0.7; }

  /* Reminder selector */
  .reminder-section { margin-top: 8px; }
  .reminder-options { display: flex; gap: 8px; flex-wrap: wrap; }
  .reminder-option {
    display: flex; align-items: center; gap: 6px;
    padding: 11px 16px; border-radius: 12px;
    background: var(--surface-elevated); border: 1px solid var(--border-light);
    color: var(--text-primary); font-size: 14px; font-weight: 500;
    cursor: pointer; transition: all 0.15s; min-height: 40px;
  }
  .reminder-option:hover { background: var(--border); }
  .reminder-option.selected {
    background: var(--accent-soft); border-color: var(--accent); color: var(--accent);
  }
  .reminder-time-label { pointer-events: none; }
  .reminder-check { color: var(--accent); font-weight: 700; }

  /* Mission reveal */
  .mission-hero {
    margin: 0;
  }
  .mission-badge { display: inline-block; }
  .mission-meta { flex-wrap: wrap; }

  /* ============================================================
     LANDING PAGE
     ============================================================ */
  .landing-screen { height: 100%; overflow-y: auto; padding: 0; position: relative; background: var(--bg); }
  .landing-header { position: absolute; top: 0; left: 0; right: 0; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
  .wordmark { font-size: 22px; font-weight: 800; letter-spacing: -1px; background: var(--gradient-welcome); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .theme-toggle-btn {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-primary); cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
    transition: all 0.2s;
  }
  .theme-toggle-btn:active { transform: scale(0.92); }
  .theme-toggle-btn .icon-sun { display: none; }
  .theme-toggle-btn .icon-moon { display: block; }
  [data-theme="light"] .theme-toggle-btn .icon-sun { display: block; }
  [data-theme="light"] .theme-toggle-btn .icon-moon { display: none; }

  .landing-hero {
    position: absolute; top: 80px; left: 0; right: 0; padding: 0 24px; text-align: center;
    animation: fadeIn 0.6s ease;
  }
  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 20px;
    background: var(--accent-soft); color: var(--accent);
    font-size: 12px; font-weight: 600; margin-bottom: 20px;
    letter-spacing: 0.3px;
  }
  .hero-title {
    font-size: 38px; font-weight: 800; line-height: 1.1;
    letter-spacing: -1.5px; margin-bottom: 16px;
  }
  .hero-subtitle {
    font-size: 16px; line-height: 1.5; color: var(--text-secondary);
    max-width: 300px; margin: 0 auto 32px;
  }
  .hero-cta-group { display: flex; flex-direction: column; gap: 10px; max-width: 280px; margin: 0 auto; }
  .btn-hero-primary {
    background: var(--accent); color: white; padding: 16px 24px;
    border-radius: 14px; font-size: 16px; font-weight: 700;
    border: none; cursor: pointer; width: 100%;
    transition: all 0.2s; min-height: 52px;
  }
  .btn-hero-primary:active { transform: scale(0.97); }
  .btn-hero-secondary {
    background: var(--surface); color: var(--text-primary);
    border: 1px solid var(--border); padding: 16px 24px;
    border-radius: 14px; font-size: 15px; font-weight: 600;
    cursor: pointer; width: 100%; transition: all 0.2s; min-height: 52px;
  }
  .btn-hero-secondary:active { transform: scale(0.97); }

  .landing-features {
    position: absolute; bottom: 150px; left: 0; right: 0; padding: 0 24px;
    display: flex; flex-direction: column; gap: 10px;

  .feature-row {

  .feature-icon {

  .feature-text { font-size: 14px; color: var(--text-secondary); line-height: 1.4; }

  .landing-footer {

    padding: 12px 24px; text-align: center;
    color: var(--text-tertiary); font-size: 11px;
    border-top: 1px solid var(--border);

  }

  /* ============================================================
     AUTH MODAL
     ============================================================ */
  .modal-overlay {
    position: fixed; inset: 0; background: var(--overlay-bg);
    z-index: 300; display: flex; align-items: center; justify-content: center;

  }
  .modal-sheet {

  .form-field { margin-bottom: 16px; }

  .form-input {

  }

  /* ============================================================
     COURSE CATALOGUE
     ============================================================ */
  .catalogue-screen { height: 100%; overflow-y: auto; padding: 20px 20px 110px; position: relative; background: var(--bg); }

  .catalogue-title { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
  .catalogue-subtitle { font-size: 14px; color: var(--text-secondary); }
  .catalogue-filters {
    display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .filter-chip {
    padding: 8px 16px; border-radius: 20px;
    background: var(--surface); border: 1px solid var(--border);

    cursor: pointer; transition: all 0.15s;
  }

function useTimer(initial = 0) {
  const [t, setT] = useState(initial);
  const ref = useRef(null);
  const start = useCallback(() => {
    ref.current = Date.now();
    setT(0);
  }, []);
  useEffect(() => {
    if (!ref.current) return;
    const iv = setInterval(() => setT(Math.floor((Date.now() - ref.current) / 1000)), 200);
    return () => clearInterval(iv);
  }, []);
  return [t, start];
}
